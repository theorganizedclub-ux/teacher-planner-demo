.soonmark{flex:0 0 auto;padding:0 var(--sp-3);border-radius:var(--r-pill);border:1px solid var(--line);color:var(--quiet);font-size:12px;line-height:1.6;}
.badge--example{margin:0 var(--sp-5) var(--sp-4);}
.prewrap{white-space:pre-wrap;margin:0;}
.formhead{margin:var(--sp-4) 0 0;font-size:var(--t-body);font-weight:var(--w-semibold);}
.formmore summary{cursor:pointer;color:var(--accent);margin-bottom:var(--sp-4);}
.btn--dangertext{color:var(--minus);border-color:transparent;}
.btn--danger{background:var(--minus);border-color:var(--minus);color:var(--on-accent);}
.sheet--wide{max-width:760px;}
.emptynote{padding:var(--sp-3) 0;}

.backlink{align-self:flex-start;padding-left:0;text-decoration:none;}
.backrow{display:flex;flex-wrap:wrap;gap:.25rem 1.25rem;align-items:center;}
.backrow .backlink{align-self:auto;}
.page>.backrow{margin-bottom:.5rem;}
.chiprow{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;}
.field--date{width:auto;}
.dashgrid{display:grid;gap:var(--sp-7);grid-template-columns:repeat(auto-fit,minmax(min(100%,21rem),1fr));align-items:start;}
.dashgrid--2{grid-template-columns:repeat(auto-fit,minmax(min(100%,28rem),1fr));}
.schedlist,.peoplelist,.simplelist,.studentlist,.attlist,.checklist,.searchres{list-style:none;margin:0;padding:0;display:grid;gap:var(--sp-1);}
.schedrow,.simplerow,.personrow{display:flex;align-items:center;gap:var(--sp-5);padding:var(--sp-3) 0;border-bottom:1px solid color-mix(in srgb,var(--hue,var(--line)) 25%,var(--line));}
.schedrow:last-child,.simplerow:last-child,.personrow:last-child{border-bottom:0;}
.schedrow__time{min-width:8.5em;font-variant-numeric:tabular-nums;font-size:var(--t-quiet);color:var(--quiet);}
.schedrow__dot{width:0.85rem;height:0.85rem;border-radius:999px;background:color-mix(in srgb,var(--hue) 70%,var(--ink));box-shadow:0 0 0 2px color-mix(in srgb,var(--hue) 60%,var(--raised));flex:0 0 auto;}
.schedrow__dot--block{background:transparent;border:2px dashed var(--line-strong);}
.schedrow__title{font-weight:var(--w-medium);}
.schedrow--block .schedrow__title{color:var(--quiet);font-weight:var(--w-regular);}
.plainlink{color:var(--ink);text-decoration:none;font-weight:var(--w-medium);}
.plainlink:hover{text-decoration:underline;color:var(--accent);}
.avatar{flex:0 0 auto;display:inline-grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:999px;background:var(--hue);color:var(--mon-ink);font-size:var(--t-quiet);font-weight:var(--w-semibold);letter-spacing:0.02em;}
.datebadge{flex:0 0 auto;min-width:6.5em;padding:var(--sp-1) var(--sp-3);border-radius:var(--r-pill);background:color-mix(in srgb,var(--mon-8) 40%,var(--raised));font-size:var(--t-quiet);text-align:center;}
.minimeter{flex:0 0 5rem;height:0.45rem;border-radius:999px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden;}
.minimeter>span{display:block;height:100%;background:var(--accent);border-radius:inherit;}
.quickgrid{display:grid;gap:var(--sp-4);grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));}
.quickbtn{display:flex;flex-direction:column;align-items:flex-start;gap:var(--sp-2);min-height:5rem;padding:var(--sp-5);border:1px solid var(--line);border-radius:var(--r-md);background:var(--raised);color:var(--ink);font:inherit;text-align:left;cursor:pointer;}
.quickbtn:hover{border-color:var(--accent);}
.quickbtn__icon{font-size:var(--t-title);}
.classsum{display:grid;gap:var(--sp-5);grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));}
.classsum__card,.classcard{display:flex;flex-direction:column;gap:var(--sp-2);padding:var(--sp-6);border-radius:var(--r-lg);text-decoration:none;color:var(--ink);border:1px solid color-mix(in srgb,var(--hue) 55%,var(--line));background:color-mix(in srgb,var(--hue) var(--tint-head,22%),var(--raised));box-shadow:var(--e-card);}
.classsum__card:hover,.classcard:hover{border-color:var(--accent);}
.classsum__name,.classcard__name{font-weight:var(--w-semibold);font-size:var(--t-body);}
.classsum__nums,.classcard__nums{display:flex;flex-wrap:wrap;gap:var(--sp-6);margin-top:var(--sp-2);font-size:var(--t-quiet);}
.classsum__nums strong,.classcard__nums strong{font-size:var(--t-body);font-variant-numeric:tabular-nums;}
.classgrid{display:grid;gap:var(--sp-7);grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr));}
.classcard{position:relative;overflow:hidden;padding-top:var(--sp-8);}
.classcard__band{position:absolute;inset:0 0 auto 0;height:6px;background:var(--hue);}
.classchip{display:inline-flex;align-items:center;min-height:1.75rem;padding:0 var(--sp-4);border-radius:var(--r-pill);background:color-mix(in srgb,var(--hue) 45%,var(--raised));color:var(--ink);font-size:var(--t-quiet);text-decoration:none;border:1px solid color-mix(in srgb,var(--hue) 70%,var(--line));}
.classchip:hover{border-color:var(--accent);}
.classhead{display:flex;flex-wrap:wrap;align-items:flex-start;gap:var(--sp-7);padding:var(--sp-7) var(--sp-8);border-radius:var(--r-lg);border:1px solid color-mix(in srgb,var(--hue) 55%,var(--line));background:linear-gradient(120deg,color-mix(in srgb,var(--hue) var(--tint-head,30%),var(--raised)),var(--raised));}
.classhead .avatar{width:3.5rem;height:3.5rem;font-size:var(--t-body);}
.classhead__name{margin:0;font-size:var(--t-big);font-weight:var(--w-semibold);line-height:var(--lh-snug);}
.classhead p{margin:0;}
.peoplelist--cols{grid-template-columns:repeat(auto-fill,minmax(min(100%,20rem),1fr));column-gap:var(--sp-8);}
.huepick{display:flex;flex-wrap:wrap;gap:var(--sp-3);}
.huepick__item{position:relative;display:inline-grid;place-items:center;width:2.5rem;height:2.5rem;cursor:pointer;}
.huepick__item input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;}
.huepick__dot{width:2rem;height:2rem;border-radius:999px;background:var(--hue);border:2px solid var(--line);}
.huepick__item input:checked + .huepick__dot{border-color:var(--ink);box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--accent);}
.huepick__item input:focus-visible + .huepick__dot{outline:var(--focus-width) solid var(--focus);outline-offset:2px;}
.checkrow{display:flex;align-items:center;gap:var(--sp-4);min-height:var(--hit-min);}
.checkrow input{width:1.2rem;height:1.2rem;accent-color:var(--accent);}
.tablewrap{overflow-x:auto;}
.datatable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
.datatable th,.datatable td{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--line);text-align:left;}
.datatable thead th{font-size:var(--t-quiet);color:var(--quiet);font-weight:var(--w-medium);}
.datatable .num{text-align:right;white-space:nowrap;}
.datatable .is-low,.is-low{color:var(--minus);font-weight:var(--w-semibold);}
.datatable tr.is-unused td{color:var(--quiet);}
.formula{padding:var(--sp-5);border-radius:var(--r-md);background:color-mix(in srgb,var(--accent) 12%,var(--raised));font-variant-numeric:tabular-nums;font-weight:var(--w-medium);margin:0;}
.studentrow{display:flex;align-items:center;gap:var(--sp-6);padding:var(--sp-4) 0;border-bottom:1px solid var(--line);}
.studentrow:last-child{border-bottom:0;}
.studentrow__name{font-size:var(--t-body);}
.studentrow__grade{min-width:5rem;text-align:right;font-weight:var(--w-semibold);font-variant-numeric:tabular-nums;}
.studentrow__flags{display:flex;gap:var(--sp-2);}
.flag{display:inline-flex;align-items:center;min-height:1.6rem;padding:0 var(--sp-3);border-radius:var(--r-pill);font-size:var(--t-quiet);border:1px solid var(--mon-6);margin-left:var(--sp-3);}
.flag--med{border-color:var(--minus);}
.contact{padding-bottom:var(--sp-4);border-bottom:1px solid var(--line);}
.contact:last-of-type{border-bottom:0;}
.contact p{margin:0;}
.contact__name{font-weight:var(--w-semibold);}
.fact__label{margin:0;font-size:var(--t-quiet);color:var(--quiet);font-weight:var(--w-medium);}
.gradebtn{min-width:5.5rem;min-height:2.25rem;padding:0 var(--sp-4);border:1px solid var(--line-strong);border-radius:var(--r-pill);background:var(--raised);color:var(--ink);font:inherit;font-weight:var(--w-semibold);font-variant-numeric:tabular-nums;cursor:pointer;}
.gradebtn:hover{border-color:var(--accent);}
.gradebtn.is-low{border-color:var(--minus);color:var(--minus);}
.timeline2{list-style:none;margin:0;padding:0;display:grid;}
.timeline2__item{display:flex;gap:var(--sp-5);padding:var(--sp-3) 0 var(--sp-3) var(--sp-5);border-left:2px solid color-mix(in srgb,var(--hue) 60%,var(--line));position:relative;}
.timeline2__icon{margin-left:calc(-1 * var(--sp-5) - 0.8rem);width:1.6rem;height:1.6rem;border-radius:999px;display:inline-grid;place-items:center;background:var(--raised);font-size:var(--t-quiet);}
.timeline2__item.is-warn{color:var(--ink);}
.timeline2__item.is-warn .timeline2__icon{box-shadow:0 0 0 2px var(--minus);}
.catrow,.scalerow{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;}
.scalegrid{display:grid;gap:var(--sp-3);grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));}
.gradetools{align-items:center;}
.gb{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--raised);box-shadow:var(--e-card);}
.gb__table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;min-width:100%;}
.gb__table th,.gb__table td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;background:var(--raised);}
.gb__table thead th{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--sechue,var(--mon-4)) 30%,var(--raised));vertical-align:bottom;}
.gb__corner{position:sticky;left:0;z-index:3 !important;text-align:left;padding:var(--sp-4) var(--sp-5) !important;font-size:var(--t-quiet);}
.gb__student{position:sticky;left:0;z-index:1;text-align:left;padding:var(--sp-3) var(--sp-5) !important;white-space:nowrap;font-weight:var(--w-regular);}
.gb__title{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:8.5rem;padding:var(--sp-3) var(--sp-4);border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;}
.gb__title:hover .gb__name{text-decoration:underline;}
.gb__name{font-size:var(--t-quiet);font-weight:var(--w-semibold);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.gb__meta{font-size:12px;color:var(--quiet);}
.gb__head.is-future{opacity:0.75;}
.gb__cell{width:100%;min-width:4.5rem;height:2.75rem;border:0;background:transparent;color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;text-align:center;}
.gb__cell:focus{outline:var(--focus-width) solid var(--focus);outline-offset:-3px;background:var(--field);}
.gb__cell.is-missing{background:color-mix(in srgb,var(--minus) 22%,transparent);font-weight:var(--w-semibold);}
.gb__cell.is-late{background:color-mix(in srgb,var(--caution) 20%,transparent);}
.gb__cell.is-excused,.gb__cell.is-exempt{color:var(--quiet);background:color-mix(in srgb,var(--ink) 6%,transparent);}
.gb__cell.is-low{color:var(--minus);font-weight:var(--w-semibold);}
.gb__cell.is-bad{outline:2px solid var(--minus);outline-offset:-3px;}
.gb__avghead{position:sticky;right:0;z-index:3 !important;padding:var(--sp-4) !important;font-size:var(--t-quiet);}
.gb__avg{position:sticky;right:0;z-index:1;padding:var(--sp-2) var(--sp-4) !important;text-align:center;white-space:nowrap;font-weight:var(--w-semibold);}
.gb__foot th,.gb__foot td{background:color-mix(in srgb,var(--ink) 5%,var(--raised));text-align:center;padding:var(--sp-3) var(--sp-2);font-size:var(--t-quiet);}
.gb__foot th{position:sticky;left:0;text-align:left;padding-left:var(--sp-5);}
.gb__footavg{display:block;font-weight:var(--w-semibold);}
.gb__footn{display:block;color:var(--quiet);font-size:12px;}
.gb__legend{margin:0;}
.bars{display:flex;align-items:flex-end;gap:var(--sp-5);height:11rem;padding-top:var(--sp-5);}
.bars__col{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:var(--sp-2);height:100%;}
.bars__bar{display:block;width:100%;max-width:3.5rem;min-height:3px;border-radius:var(--r-sm) var(--r-sm) 0 0;background:var(--mon-5);}
.bars__bar--a{background:var(--mon-5);} .bars__bar--b{background:var(--mon-7);} .bars__bar--c{background:var(--mon-3);} .bars__bar--d{background:var(--mon-2);} .bars__bar--f{background:var(--mon-1);}
.bars__n{font-size:var(--t-quiet);font-weight:var(--w-semibold);}
.bars__label{font-size:var(--t-quiet);color:var(--quiet);}
.daynav{align-items:center;}

<script>
// Theme and text size are read before first paint, so there is never a flash
// of the wrong one. The real settings live in the planner's own storage; this
// is a mirror that only this script reads.
(function () {
  try {
    var raw = window.localStorage.getItem('atp.look');
    if (!raw) return;
    var look = JSON.parse(raw);
    var root = document.documentElement;
    if (look.theme) root.setAttribute('data-theme', look.theme);
    if (look.palette) root.setAttribute('data-palette', look.palette);
    if (look.size) root.setAttribute('data-size', look.size === 'larger' ? 'largest' : look.size);
    if (look.reduceMotion) root.setAttribute('data-motion', 'reduce');
  } catch (e) { /* private mode, or storage turned off */ }
}());
</script>

function parseCsv(text) {
